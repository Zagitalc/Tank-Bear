# Routing engine for Great Britain. First start downloads the OpenStreetMap extract (about 2 GB) and builds the graph;
# that takes a while and needs several GB of RAM and disk. It listens on this machine only (127.0.0.1:8002).
# Never publish this port: it has no authentication.
services:
  valhalla:
    # 3.9.1 Arm64 manifest verified 2026-10-11 against the official registry.
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:f182f45e9e71cbe737e6c394d68808c67a7bd12e2a4cc47c4aba864de77ecdc6
    platform: linux/arm64
    # Reserve memory/CPU for the API and scheduled fuel refresh.
    mem_limit: 9g
    memswap_limit: 9g
    cpus: 1.5
    restart: unless-stopped # Initial GB build verified on 2026-10-11.
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - /var/lib/valhalla/custom_files:/custom_files
    environment:
      tile_urls: "https://download.geofabrik.de/europe/great-britain-latest.osm.pbf"
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      server_threads: "2"
